<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>MathModel Workbench</title>
  <link rel="stylesheet" href="/dashboard/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="工作台导航">
      <div class="brand"><span class="brand-mark">∑</span><div><strong>MathModel</strong><span>Workbench</span></div></div>
      <div class="project-switcher"><span class="label">当前项目</span><strong id="project-name">加载中…</strong><span id="project-path" class="muted truncate"></span></div>
      <nav class="nav-list" id="nav-list">
        <button class="nav-item active" data-view="overview"><span class="nav-icon">⌂</span>概览</button>
        <button class="nav-item" data-view="workflow"><span class="nav-icon">◎</span>建模流程</button>
        <button class="nav-item" data-view="experiments"><span class="nav-icon">◒</span>实验结果</button>
        <button class="nav-item" data-view="code"><span class="nav-icon">&lt;/&gt;</span>代码与日志</button>
        <button class="nav-item" data-view="delivery"><span class="nav-icon">□</span>论文与交付</button>
      </nav>
      <div class="sidebar-footer"><span class="status-dot" id="connection-dot"></span><span id="connection-label">正在连接</span><button class="icon-button" id="theme-toggle" title="切换主题" aria-label="切换主题">◐</button></div>
    </aside>
    <main class="main-content">
      <header class="topbar"><div><p class="eyebrow">MATHMODEL / LOCAL WORKSPACE</p><h1 id="view-title">概览</h1></div><div class="topbar-actions"><span class="last-sync" id="last-sync">等待状态</span><button class="button secondary" id="refresh-button">↻ 刷新</button></div></header>
      <div id="app" aria-live="polite"></div>
    </main>
  </div>
  <noscript><p class="noscript">MathModel Workbench 需要启用 JavaScript 才能读取本地项目状态。</p></noscript>
  <script src="/dashboard/dashboard.js"></script>
</body>
</html>
