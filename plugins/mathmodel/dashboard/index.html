<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <meta name="description" content="MathModel engineering workbench" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231b1d20'/%3E%3Cpath d='M8 8h16v16H8zM12 12h8v8h-8z' fill='none' stroke='%23f0f1f2' stroke-width='2'/%3E%3C/svg%3E" />
  <title>MathModel Workbench</title>
  <link rel="stylesheet" href="/dashboard/styles.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-glyph">M</span><span class="brand-name">MathModel</span><span class="slash">/</span><span id="project-name" class="project-name">加载项目…</span></div>
      <div class="top-actions"><button class="subtle-btn" data-toggle-files>文件</button><span id="connection-label" class="connection"><i id="connection-dot"></i>连接中</span><span id="last-sync" class="sync">等待状态</span><button id="refresh-button" class="tool-btn" title="刷新状态" aria-label="刷新状态">↻</button><button id="theme-toggle" class="tool-btn" title="切换主题" aria-label="切换浅深色主题">◐</button></div>
    </header>
    <div class="workspace">
      <aside class="file-pane" aria-label="项目文件">
        <div class="pane-heading"><span>项目文件</span><button id="collapse-files" class="subtle-btn" title="折叠文件树" aria-label="折叠文件树">−</button></div>
        <div id="project-path" class="project-path">读取项目目录…</div>
        <div class="file-tree" id="file-tree"></div>
        <div class="pane-footer"><span class="tiny-dot"></span><span>本地工作区</span><span class="mono">LOCAL</span></div>
      </aside>
      <main class="main-pane">
        <nav class="tabs" id="tabs" aria-label="工作台视图">
          <button class="tab active" data-view="overview">总览</button><button class="tab" data-view="workflow">流程</button><button class="tab" data-view="experiments">实验</button><button class="tab" data-view="code">代码</button><button class="tab" data-view="delivery">交付</button>
        </nav>
        <div id="notice" class="notice" role="status" hidden></div>
        <div id="app"></div>
      </main>
      <aside class="inspector" aria-label="任务与验证">
        <div class="inspector-head"><span>运行与验证</span><button id="run-check" class="run-btn">检查证据</button></div>
        <section class="inspector-section"><div class="section-label">当前任务</div><div id="inspector-task" class="task-card"><span class="task-state"></span><div><strong>等待 Codex</strong><p>在对话中说“开始建模”</p></div></div></section>
        <section class="inspector-section"><div class="section-label">验证门禁</div><div id="guard-summary" class="guard-summary"></div></section>
        <section class="inspector-section log-section"><div class="section-label">最近日志</div><div id="side-log" class="side-log"><span class="muted">暂无日志</span></div></section>
        <section class="inspector-section next-section"><div class="section-label">下一步</div><div id="next-action" class="next-action">等待 Pro 验证建议</div><button id="copy-next" class="copy-btn">复制到对话</button></section>
      </aside>
    </div>
  </div>
  <noscript><p class="noscript">MathModel Workbench 需要启用 JavaScript。</p></noscript>
  <script src="/dashboard/dashboard.js"></script>
</body>
</html>
