name: Release Standard

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify version and tracked archives
        run: |
          python scripts/verify_release_tag.py "${GITHUB_REF_NAME}"
          python scripts/check_skills.py
          python scripts/build_release_packages.py --verify

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/MathModel-Skill-Standard.zip
          dist/SHA256SUMS.txt
          --verify-tag
          --title "MathModel Skill Standard ${GITHUB_REF_NAME#v}"
          --generate-notes
