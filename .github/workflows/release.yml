name: Release Lite
on:
  push:
    tags: ["v*-lite.*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate tag, branch, edition and tracked archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c "import os; from pathlib import Path; v=Path('VERSION').read_text().strip(); assert os.environ['RELEASE_TAG']=='v'+v and '-lite.' in v"
          git merge-base --is-ancestor HEAD origin/lite
          python -S scripts/check_skills.py
          python -S scripts/build_release_packages.py --verify
          python -S tests/test_installation.py
      - name: Publish universal asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/MathModel-Skill-Lite.zip
          dist/SHA256SUMS.txt
          --verify-tag
          --title "MathModel Skill Lite ${GITHUB_REF_NAME}"
          --generate-notes
