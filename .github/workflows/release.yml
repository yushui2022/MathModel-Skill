name: Release MathModel Flash

on:
  push:
    tags:
      - "v2.0.0-flash.1"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify version and tracked archives
        run: |
          test "$(cat VERSION)" = "2.0.0-flash.1"
          python scripts/build_release_packages.py --verify

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/MathModel-Skill-Flash-Trae.zip
          dist/MathModel-Skill-Flash-Claude-Code.zip
          dist/MathModel-Skill-Flash-Codex.zip
          dist/SHA256SUMS.txt
          --verify-tag
          --prerelease
          --title "MathModel Skill Flash 2.0.0-flash.1"
          --generate-notes
